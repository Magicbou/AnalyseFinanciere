name: InvestPilot deploy Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          response=$(curl --silent --show-error --get https://api.cloudflare.com/client/v4/user/tokens/verify \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "$response" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const r=JSON.parse(s);
              if (!r.success || r.result?.status !== "active") {
                console.error("Cloudflare a rejeté le jeton API. Statut:", r.result?.status ?? "inconnu");
                console.error("Détails:", JSON.stringify(r.errors ?? []));
                process.exit(1);
              }
              console.log("Jeton Cloudflare valide et actif.");
            });
          '
      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 d1 migrations apply investpilot-history --remote --config wrangler.worker.toml
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config wrangler.worker.toml
      - name: Verify published Worker API
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            if curl --silent --fail https://analysefinanciere.boudas-pascal.workers.dev/api/health > /tmp/health.json; then break; fi
            sleep 3
          done
          node <<'NODE'
          const fs = require("fs");
          const d = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
          if (d.status !== "ok" || d.version !== "0.6.1") {
            console.error("Version Worker inattendue:", d);
            process.exit(1);
          }
          NODE
          curl --silent --fail https://analysefinanciere.boudas-pascal.workers.dev/ | grep -q "InvestPilot"
          curl --silent --show-error --fail --max-time 120 https://analysefinanciere.boudas-pascal.workers.dev/api/catalog/amundi > /tmp/amundi-catalog.json
          node <<'NODE'
          const fs = require("fs");
          const d = JSON.parse(fs.readFileSync("/tmp/amundi-catalog.json", "utf8"));
          console.log("Catalogue Amundi:", JSON.stringify({
            sourceTotal: d.sourceTotal,
            productCount: d.productCount,
            completeness: d.completeness,
            performanceCoverage: d.audit?.performanceCoverage
          }));
          if (d.status !== "ok" || d.productCount < 500 || d.completeness !== "complete") {
            console.error("Catalogue Amundi incomplet ou non vérifié.");
            process.exit(1);
          }
          const sample = d.products?.find(p => p.isin === "LU1135865084");
          const periods = ["performance1y", "performance3y", "performance5y", "performance10y"];
          const missing = periods.filter(k => typeof sample?.[k] !== "string" || !Number.isFinite(Number(sample[k])));
          const coverage = d.audit?.performanceCoverage;
          if (!sample || missing.length || !coverage || periods.some((_, index) => {
            const key = ["oneYear", "threeYears", "fiveYears", "tenYears"][index];
            return !(coverage[key] > 0);
          })) {
            console.error("Performances Amundi absentes ou couverture nulle:", { missing, coverage });
            process.exit(1);
          }
          if (Number(sample.performance1y) < 1 || Number(sample.performance1y) > 40
            || Number(sample.performance10y) < 50 || Number(sample.performance10y) > 1500) {
            console.error("Performances Amundi hors échelle attendue en pourcentage:", sample);
            process.exit(1);
          }
          if (!String(d.source || "").includes("/particuliers/")) {
            console.error("Le catalogue Amundi n'utilise pas le profil particuliers.");
            process.exit(1);
          }
          console.log("Performances Amundi vérifiées pour LU1135865084:", Object.fromEntries(periods.map(k => [k, sample[k]])));
          NODE
          curl --silent --show-error --fail --max-time 60 "https://analysefinanciere.boudas-pascal.workers.dev/api/market/history?isin=LU1681043599&ticker=CW8%20FP" > /tmp/yahoo-history.json
          node <<'NODE'
          const fs = require("fs");
          const d = JSON.parse(fs.readFileSync("/tmp/yahoo-history.json", "utf8"));
          console.log("Historique Yahoo Finance:", JSON.stringify({
            status: d.status,
            points: d.points?.length,
            annualReturns: d.annualReturns?.length,
            source: d.source
          }));
          if (d.status !== "ok" || !Array.isArray(d.points) || d.points.length < 1) {
            console.error(d.message || d);
            process.exit(1);
          }
          NODE
